<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TS decode test</title>
<style>
  body { background: #111; color: #ddd; font: 13px system-ui, sans-serif; margin: 16px; }
  input, select, button { font: inherit; }
  #path { width: 60ch; }
  canvas { display: block; margin-top: 10px; max-width: 100%; background: #000; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- development page for the in-browser TS decoder (tsdecode.js): /static/tstest.html?path=<capture rel> -->
<div>
  <input id="path" placeholder="capture 기준 경로 (.ts)">
  <button id="open">열기</button>
  frame <input id="frame" type="number" value="0" min="0" style="width:10ch">
  <select id="lowres"><option value="0">Full</option><option value="1">Half</option><option value="2">Quarter</option></select>
  <label><input id="key" type="checkbox"> I-frame만</label>
  <button id="go">디코딩</button>
  <label><input id="bob" type="checkbox"> bob(top)</label>
  <button id="play">GOP 오디오 재생</button>
</div>
<canvas id="cv"></canvas>
<pre id="out"></pre>
<script src="/static/util.js"></script>
<script src="/static/yuv.js"></script>
<script src="/static/tsdecode.js"></script>
<script>
const dec = new TsDecoder(Number(new URLSearchParams(location.search).get("workers")) || 4);
const ren = new YuvRenderer($("#cv"));
const out = (o) => { $("#out").textContent = typeof o === "string" ? o : JSON.stringify(o, null, 1); };
let last = null;

async function openClip(path) {
  const t = performance.now();
  const info = await dec.open(path);
  out({ open_ms: Math.round(performance.now() - t), ...info });
  return info;
}

/* decode frame n and show it; returns timings (and keeps the GOP in `last` for frameY) */
async function show(n, lowres = 0, keyOnly = false) {
  const t = performance.now();
  const g = await dec.decode(n, { lowres, keyOnly });
  const idx = keyOnly ? 0 : n - g.frame;
  ren.field = $("#bob").checked ? 0 : -1;
  ren.draw({ yuv: g.yuv, offset: idx * g.frameSize, w: g.w, h: g.h, cw: g.cw, ch: g.ch, srcH: dec.info.height,
             progressive: dec.info.progressive });
  last = { g, idx };
  const r = { frame: n, gop: g.frame, frames: g.count, pictures: g.pictures, MB: +(g.bytes / 1e6).toFixed(2),
              gop_ms: Math.round(g.tGop), fetch_ms: Math.round(g.tFetch), decode_ms: Math.round(g.tDecode),
              audio_ms: Math.round(g.tAudio || 0), samples: g.audio?.[0]?.length || 0,
              total_ms: Math.round(performance.now() - t) };
  out(r);
  return r;
}

/* Y plane of the last shown frame, base64 (for comparing with native ffmpeg) */
function frameY() {
  const { g, idx } = last;
  const y = g.yuv.subarray(idx * g.frameSize, idx * g.frameSize + g.w * g.h);
  let s = "";
  for (let i = 0; i < y.length; i += 0x8000) s += String.fromCharCode(...y.subarray(i, i + 0x8000));
  return btoa(s);
}

/* audio of the GOP holding frame n (decoded with its video), channel ch, base64 float32 */
async function gopAudio(n, ch = 0) {
  const g = await dec.decode(n, { lowres: 2 });
  const a = g.audio[ch];
  const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength);
  let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return { frame: g.frame, frames: g.count, audio: btoa(s) };
}

let actx = null;
$("#play").onclick = () => {
  const a = last?.g.audio;
  if (!a?.length) return;
  actx ??= new AudioContext({ sampleRate: 48000 });
  const b = actx.createBuffer(2, a[0].length, 48000);
  b.copyToChannel(a[0], 0);
  b.copyToChannel(a[1], 1);
  const src = actx.createBufferSource();
  src.buffer = b;
  src.connect(actx.destination);
  src.start();
};
$("#open").onclick = () => openClip($("#path").value).catch((e) => out(String(e)));
$("#go").onclick = () => show(Number($("#frame").value), Number($("#lowres").value), $("#key").checked)
  .catch((e) => out(String(e)));
const q = new URLSearchParams(location.search).get("path");
if (q) { $("#path").value = q; openClip(q).catch((e) => out(String(e))); }
</script>
</body>
</html>
